server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/auth/**
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/portfolio/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
